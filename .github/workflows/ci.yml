name: CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: rastro
          POSTGRES_DB: rastro
          POSTGRES_PASSWORD: rastro_dev
        ports:
          - "54329:5432"
        options: >-
          --health-cmd "pg_isready -U rastro -d rastro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
        env:
          RASTRO_TEST_DB_URL: postgresql://rastro:rastro_dev@localhost:54329/rastro
